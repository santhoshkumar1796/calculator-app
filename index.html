<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div class="expression" data-testid="expression"></div>
      <output class="result" data-testid="display" aria-live="polite">0</output>
    </div>
    <div class="keys">
      <button data-action="clear" class="fn">AC</button>
      <button data-action="delete" class="fn" aria-label="Delete">⌫</button>
      <button data-action="percent" class="fn">%</button>
      <button data-op="/" class="op" aria-label="Divide">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*" class="op" aria-label="Multiply">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op" aria-label="Subtract">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op" aria-label="Add">+</button>

      <button data-action="sign" aria-label="Toggle sign">±</button>
      <button data-num="0">0</button>
      <button data-action="decimal" aria-label="Decimal">.</button>
      <button data-action="equals" class="eq" aria-label="Equals">=</button>
    </div>
  </main>
  <script src="calculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
